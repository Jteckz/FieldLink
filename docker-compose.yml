services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: internship_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://postgres:postgres@db:5432/internship_platform
      PRIVATE_MEDIA_ROOT: /data/private_media
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - private_media:/data/private_media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  private_media:
